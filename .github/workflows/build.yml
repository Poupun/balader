name: build

# Every push / PR: all test layers on macOS and Windows.
# Then installers: universal macOS .app/.dmg and Windows .exe (NSIS) / .msi,
# uploaded as workflow artifacts. Push a tag like v0.1.0 to attach them to a
# GitHub release instead.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Type-check UI
        run: npm run typecheck
      - name: Rust tests (core + CLI)
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Generated TS bindings are up to date
        shell: bash
        run: |
          cargo test -q -p balader-core export_bindings
          git diff --exit-code -- src/api/bindings
      - name: UI unit tests
        run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end (mock backend, WebKit + Chromium)
        run: npm run test:e2e
      - name: Production bundle under the app CSP
        run: npm run test:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results

  bundle:
    name: bundle (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle
          - name: windows-x64
            os: windows-latest
            args: ''
            bundles: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Balader {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: balader-${{ matrix.name }}
          path: |
            ${{ matrix.bundles }}/dmg/*.dmg
            ${{ matrix.bundles }}/macos/*.app
            ${{ matrix.bundles }}/nsis/*.exe
            ${{ matrix.bundles }}/msi/*.msi
          if-no-files-found: ignore

[workspace]
resolver = "3"
members = ["crates/balader-core", "crates/balader-cli", "src-tauri"]
# `cargo test` / `cargo build` at the root only touch the fast crates.
# Build the desktop app with `npm run tauri build` (or `cargo build -p balader`).
default-members = ["crates/balader-core", "crates/balader-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
balader-core = { path = "crates/balader-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
regex = "1"
log = "0.4"
base64 = "0.22"
url = "2"
dirs = "6"
ts-rs = "12"

[profile.release]
codegen-units = 1
lto = true
strip = true
